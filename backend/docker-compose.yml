# E-Notary backend: API + PostgreSQL + Alembic
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: enotary-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enotary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: enotary-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/enotary
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/enotary
      SECRET_KEY: change-me-in-production-use-openssl-rand-hex-32
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: enotary-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/enotary
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/enotary
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
