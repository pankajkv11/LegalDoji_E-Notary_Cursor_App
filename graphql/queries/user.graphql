query Me {
  me {
    id
    name
    email
    phone
    role
    status
    emailVerified
    phoneVerified
    permissions
    createdAt
    updatedAt
  }
}

query User($id: String!) {
  user(id: $id) {
    id
    name
    email
    phone
    role
    status
    emailVerified
    phoneVerified
    permissions
    createdAt
    updatedAt
  }
}
