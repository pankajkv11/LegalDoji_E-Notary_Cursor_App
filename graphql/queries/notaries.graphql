query Notary($id: String!) {
  notary(id: $id) {
    id
    userId
    fullName
    email
    phone
    photoUrl
    licenseNumber
    barCouncilNumber
    barCouncilState
    enrollmentDate
    experience
    specialization
    languages
    location
    consultationFee
    rating
    reviewsCount
    completedSessions
    bio
    isVerified
    verificationDate
    createdAt
    updatedAt
  }
}

query Notaries($specialization: String, $location: String) {
  notaries(specialization: $specialization, location: $location) {
    id
    userId
    fullName
    email
    phone
    photoUrl
    specialization
    location
    consultationFee
    rating
    reviewsCount
    isVerified
    createdAt
  }
}

# Admin query to fetch all notary applications
query NotaryApplications($status: String, $limit: Int, $offset: Int) {
  notaryApplications(status: $status, limit: $limit, offset: $offset) {
    id
    applicationNumber
    userId
    firstName
    middleName
    lastName
    email
    phone
    licenseNumber
    barCouncilNumber
    experience
    specialization
    location
    status
    appliedAt
    reviewedAt
    createdAt
    updatedAt
  }
}

# Admin query to fetch a specific application
query NotaryApplication($id: String!) {
  notaryApplication(id: $id) {
    id
    applicationNumber
    userId
    firstName
    middleName
    lastName
    email
    phone
    licenseNumber
    barCouncilNumber
    experience
    specialization
    location
    status
    appliedAt
    reviewedAt
    createdAt
    updatedAt
  }
}

# User query to check their own application status
query MyNotaryApplication {
  myNotaryApplication {
    id
    applicationNumber
    userId
    firstName
    middleName
    lastName
    email
    phone
    status
    appliedAt
    reviewedAt
    createdAt
    updatedAt
  }
}
